<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" height="100%">
  <style>
    use {
      fill: none;
      stroke-width: 12;
      stroke-linecap: butt;
      stroke-linejoin: round;
      animation: flow 6s linear infinite;
    }
    /* dashes run along each glyph contour: outer contours clockwise, counters anticlockwise (font winding).
       each colour is one 900-unit dash run; delays place the runs and give every contour its own phase */
    @keyframes flow {
      from { stroke-dashoffset: 0; }
      to   { stroke-dashoffset: -900; }
    }
    @media (prefers-reduced-motion: reduce) { use { animation: none; } }
  </style>
  <!-- no viewBox on the outer svg: it has no intrinsic aspect ratio, so the background fills
       whatever box it is drawn into (e.g. an object-fit: cover page cover) without being cropped -->
  <rect fill="#111" width="100%" height="100%"/>
